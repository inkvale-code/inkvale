<h1>Cover Letter Generator</h1>
<p>Paste the job description and your key skills. This tool generates a simple cover letter draft.</p>

<label>Job Description:</label>
<textarea id="job" placeholder="Paste the job description here..."></textarea>

<label>Key Skills (comma separated):</label>
<input type="text" id="skills" placeholder="e.g., JavaScript, communication, leadership">

<button id="generate">Generate Cover Letter</button>

<div id="out" class="output"></div>

<script>
document.getElementById('generate').addEventListener('click',function(){
  const job = document.getElementById('job').value.trim();
  const skills = document.getElementById('skills').value.trim();
  if(!job || !skills){ alert('Please enter both job description and skills.'); return; }

  const skillList = skills.split(',').map(s=>s.trim()).join(', ');
  const letter = `Dear Hiring Manager,

I am excited to apply for this position. Based on the job description:

${job}

I believe my skills in ${skillList} make me a strong candidate for this role. I am confident that I can contribute effectively to your team and deliver results.

Thank you for considering my application.

Best regards,
[Your Name]`;

  const out = document.getElementById('out');
  out.textContent = letter;
  out.style.display = 'block';
});
</script>
