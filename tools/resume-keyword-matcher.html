<h1>Resume Keyword Matcher</h1>
<p>Paste the job description and your resume. The tool highlights matched keywords and gives a match score.</p>

<label>Job description</label>
<textarea id="job" placeholder="Paste job advert here..."></textarea>
<label>Your resume</label>
<textarea id="resume" placeholder="Paste your resume here..."></textarea>
<button id="run">Run Match</button>

<div id="out" class="output">
  <p>Match score: <span id="score">0%</span></p>
  <div id="matches"></div>
</div>

<script>
function tokenize(text){ return text.toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(Boolean); }
document.getElementById('run').addEventListener('click',function(){
  const job = document.getElementById('job').value || '';
  const resume = document.getElementById('resume').value || '';
  if(!job||!resume){ alert('Please paste both the job description and your resume.'); return;}
  const jobTokens = [...new Set(tokenize(job))];
  const resumeTokens = new Set(tokenize(resume));
  const matches = jobTokens.filter(t=>resumeTokens.has(t));
  const score = jobTokens.length ? Math.round(matches.length / jobTokens.length * 100) : 0;
  document.getElementById('score').textContent = score + '%';
  document.getElementById('matches').innerHTML = '<strong>Matched keywords:</strong> ' + (matches.length ? matches.join(', ') : 'none');
  document.getElementById('out').style.display = 'block';
});
</script>
