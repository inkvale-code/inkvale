<h1>ATS Resume Scanner</h1>
<p>Paste your resume. This tool checks for common ATS issues: keyword matches, bullet usage, and line length.</p>

<label>Paste your resume:</label>
<textarea id="resume" placeholder="Paste your resume here..."></textarea>
<button id="scan">Scan Resume</button>

<div id="out" class="output">
  <p>Score: <span id="score" class="badge">0%</span></p>
  <div id="feedback"></div>
</div>

<script>
function tokenize(text){ return text.toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(Boolean); }

document.getElementById('scan').addEventListener('click',function(){
  const resume = document.getElementById('resume').value || '';
  if(!resume){ alert('Please paste your resume.'); return; }

  const tokens = tokenize(resume);
  let score = 0;
  const feedback = [];

  // Simple ATS rules
  if(tokens.length >= 150 && tokens.length <= 600){ score += 30; } else { feedback.push('Resume length may be too short or too long.'); }
  if(resume.includes('-') || resume.includes('•')){ score += 30; } else { feedback.push('Consider using bullet points.'); }
  const keywords = ['experience','skills','education','project','certification'];
  let matches = 0;
  keywords.forEach(k => { if(tokens.includes(k)) matches++; });
  score += matches * 8; // max 40
  if(matches < keywords.length){ feedback.push('Some important keywords are missing: ' + keywords.filter(k => !tokens.includes(k)).join(', ')); }

  if(score > 100) score = 100;
  document.getElementById('score').textContent = score + '%';
  document.getElementById('feedback').innerHTML = feedback.length ? '<ul><li>'+feedback.join('</li><li>')+'</li></ul>' : 'Good job! Resume looks ATS-friendly.';
  document.getElementById('out').style.display = 'block';
});
</script>
