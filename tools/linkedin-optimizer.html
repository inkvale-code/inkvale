<!doctype html>
<html lang="en">
<head>
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"SoftwareApplication",
  "name":"LinkedIn Profile Optimizer",

  "applicationCategory":"BusinessApplication",
  "description":"Analyze and optimize your LinkedIn profile to increase recruiter visibility.",
  "operatingSystem":"Web",

<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LinkedIn Profile Optimizer — Inkvale</title>
<meta name="description" content="Analyze and optimize your LinkedIn profile to increase recruiter visibility. Free tool by Inkvale.">
<meta property="og:title" content="LinkedIn Profile Optimizer — Inkvale"/>
<meta property="og:description" content="Analyze and optimize your LinkedIn profile to increase recruiter visibility. Free tool by Inkvale."/>
<meta property="og:type" content="website"/>
<link rel="canonical" href="https://inkvale-code.github.io/inkvale/tools/linkedin-optimizer.html"/>
<style>
body{font-family:Arial,Helvetica,sans-serif;max-width:820px;margin:20px auto;padding:12px}
textarea{width:100%;height:150px;padding:8px;margin:8px 0}
button{padding:8px 12px;border-radius:6px;border:0;background:#5A73FF;color:#fff}
.output{background:#f7f7f7;padding:12px;border-radius:6px;margin-top:12px}
</style>
</head>
<body>
<h1>LinkedIn Profile Optimizer</h1>
<p>Paste your LinkedIn summary here to get automated tips to improve recruiter visibility.</p>
<textarea id="profile" placeholder="Paste your LinkedIn summary"></textarea>
<button id="run">Analyze Profile</button>

<div id="out" class="output" style="display:none">
<h3>Suggestions:</h3>
<ul id="suggestions"></ul>
<p><a href="/products/" class="button">View our LinkedIn Optimization Starter Kit →</a></p>
</div>

<script>
document.getElementById('run').addEventListener('click', function(){
  const profile = document.getElementById('profile').value.trim();
  if(!profile){ alert('Please paste your summary'); return;}
  const tips = [
    "Use keywords relevant to your industry.",
    "Highlight measurable achievements.",
    "Include a professional headline.",
    "Ensure your profile photo is professional.",
    "Add a clear call-to-action in your summary."
  ];
  const ul = document.getElementById('suggestions');
  ul.innerHTML='';
  tips.forEach(t=>{const li=document.createElement('li');li.textContent=t;ul.appendChild(li)});
  document.getElementById('out').style.display='block';
});
</script>

</body>
</html>
