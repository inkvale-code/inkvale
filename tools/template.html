<body>
<nav>

</nav>

<h1>TOOL_TITLE</h1>
<p class="small">TOOL_DESC</p>

<div id="formArea">
  <!-- Replace this block per tool -->
  INPUTS_HTML
  <button id="runBtn">Run</button>
</div>

<div id="out" class="output" style="display:none">
  <div id="result"></div>
  <div class="cta">
    <p><strong>Next step:</strong> <span id="upsellText"></span></p>
    <p class="small">Get the full pack: <a id="upsellLink" href="#" target="_blank">Open product →</a></p>
  </div>
</div>

<script>
function tokenize(text){
  return (text||'').toLowerCase().replace(/[^\w\s]/g,' ').split(/\s+/).filter(Boolean);
}
function uniq(arr){ return [...new Set(arr)]; }
function getVal(id){ const el=document.getElementById(id); return el?el.value:''; }
function showOut(html, upsellText, upsellHref){
  document.getElementById('result').innerHTML = html;
  document.getElementById('upsellText').textContent = upsellText || '';
  document.getElementById('upsellLink').href = upsellHref || '#';
  document.getElementById('out').style.display='block';
}

// Replace this function per tool:
async function runTool(){
  showOut('<p class="small">Tool not configured yet.</p>','See all products','/products/');
}

document.getElementById('runBtn').addEventListener('click', async () => {
  try{ await runTool(); }catch(e){ showOut('<pre>Error: '+e.message+'</pre>','See all products','/products/'); }
});
</script>
</body>
